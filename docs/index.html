        ${yn(g.pass)}
      </div>
      <p class="sm mut" style="margin-block-end:6px">${esc(g.req)}</p>
      <div class="row"><b class="num" style="font-size:13px">${esc(ar(g.val))}</b></div>
      ${g.ratio !== undefined ? bar(g.ratio * 100, g.pass ? 'g' : 'red') : ''}
      ${g.miss && g.miss.length ? `<div class="sm" style="color:var(--r-500);margin-block-start:6px">الناقص: ${g.miss.map(id => {
        const k = [...TRACKS.flatMap(t => t.kpis), ...SHARED].find(x => x.id === id);
        return esc(k ? k.name : id);
      }).join(' · ')}</div>` : ''}
    </div>`).join('')}</div>`;
}

/* ============ بوّابة الجهة ============ */
function viewEntity(cid) {
  const c = CASE(cid); if (!c) return viewHome();
  const r = rowOf(cid); if (!r) return viewHome();
  const ent = E(c.entity), t = T(c.track), el = r.s1.el;
  const b = boards()[c.key];
  const openForm = ['qualified', 'finalist', 'honored', 'winner', 'out2'].includes(r.state);
  const sub = DB.submissions[cid];

  return `
  ${pageHead(ent.name, `${esc(caseLabel(c, true))} · ${esc(SECTORS[ent.sector].name)} · ${esc(ent.region)}`,
    stateBadge(r.state) + (r.rank1 ? pill('المرتبة ' + ar(r.rank1) + ' من ' + ar(b.counts.eligible) + ' في الفئة', 'i') : ''),
    `<a href="#/board">لوحة الجائزة</a> ${ic('arrow')} <a href="#/track/${c.track}">${esc(t.short)}</a> ${ic('arrow')} <a href="#/cat/${c.key}">${esc(C(c.key).short)}</a> ${ic('arrow')} ملفّ الجهة`)}

  ${r.blocked ? note('<b>هذا الملفّ محجوب.</b> صدر قرارُ حجبٍ من لجنة الحجب والتظلّم. الملفُّ يبقى مفتوحاً للاطّلاع ولا يدخل الترتيب. للجهة أن تتظلّم خلال ' + ar(CYCLE.appealWeeks) + ' أسابيع من إعلان النتائج.', 'r', 'shield') : ''}

  ${card(head('المسار الشخصيّ للملفّ', 'أين أنت الآن، وما الذي يفتح الخطوةَ التالية.')
    + journeyHtml(r))}

  ${card(head('١ · بوّابة الأهليّة', 'ثلاثةُ شروطٍ من دليل الجائزة. سقوطُ واحدٍ يُسقِط الملفّ.',
      el.pass ? pill('مستوفاة', 'g') : pill('غيرُ مستوفاة', 'r'))
    + gatesHtml(el))}

  ${card(head('٢ · لوحة المؤشّرات', 'قيمُ الدورات الثلاث كما وردت من المصادر الرسمية. الخطُّ الذهبيّ هو المستهدَف الوطنيّ.',
      `<span class="tag"><i>درجة المرحلة ١</i><b class="num">${fmt(r.s1s, 1)}</b></span>`)
    + kpiTable(c, el))}

  ${card(head('٣ · استمارة المشاركة',
      openForm ? 'مفتوحةٌ لك: أنت ضمن أفضل ' + ar(STAGES[0].cut) + ' في الفئة.'
               : 'تُفتَح في المرحلة الثانية لأفضل ' + ar(STAGES[0].cut) + ' جهاتٍ في كلّ فئةٍ وحدهم.',
      openForm ? (sub ? pill('مُرسَلة · ' + dt(sub.at), 'g') : pill('لم تُرسَل بعد', 'a')) : pill('مُقفَلة', ''))
    + (openForm ? formHtml(cid, sub)
      : `<div class="empty">${ic('lock')}<p>الاستمارةُ ليست بابَ الدخول إلى الجائزة، بل بابَ المرحلة الثانية.<br>
         المرحلةُ الأولى تُحسَب من بياناتك الرسمية وحدها — ولا يُقدَّم فيها ملفٌّ ولا تُكتَب فيها كلمة.</p>
         ${r.state === 'ineligible' ? '' : link('اقرأ المنهجية', '#/method')}</div>`))}

  ${openForm ? card(head('٤ · الزيارة الميدانية', 'للتحقّق من المعلومات والأدلّة — لا لعرضٍ تقديميّ.')
    + visitHtml(cid, r)) : ''}

  ${card(head('٥ · التظلّم', `يُقدَّم خلال ${ar(CYCLE.appealWeeks)} أسابيع من تاريخ حفل الجائزة وإعلان النتائج، عبر البريد المخصّص.`)
    + appealBox(cid, r))}
  `;
}

/* رحلةُ الملفّ */
function journeyHtml(r) {
  const st = r.state;
  const idx = { ineligible: 0, out1: 1, qualified: 2, out2: 2, finalist: 3, honored: 4, winner: 4, blocked: 0 }[st] ?? 0;
  const nodes = [
    ['التسجيل', 'تمّ', true],
    ['الأهليّة', r.eligible ? 'اجتاز' : 'لم يجتز', r.eligible],
    ['المرحلة ١ · المؤشّرات', r.rank1 ? 'المرتبة ' + ar(r.rank1) : '—', idx >= 2],
    ['المرحلة ٢ · الأنظمة', r.s2s === null ? 'قيد التقييم' : 'الدرجة ' + fmt(r.s2s, 1), idx >= 3],
    ['المرحلة ٣ · التحكيم', r.finalPos === 0 ? 'فائز' : r.finalPos > 0 ? 'مُكرَّم' : '—', idx >= 4]
  ];
  return `<div class="funnel">${nodes.map(([n, v, ok], i) => `
    <div class="fn fn--j fn--${ok ? (i === 4 ? 4 : 2) : 0}">
      <div class="fn__l">${esc(n)}</div>
      <div class="fn__t"><i style="inline-size:${ok ? 100 : 0}%"></i></div>
      <div class="fn__n">${esc(v)}</div>
    </div>`).join('')}
  <p class="sm mut" style="margin:var(--s-2) 0 0">${esc(STATE[st].desc)}</p></div>`;
}

/* جدول المؤشّرات */
/** مؤشّرٌ نسبيّ بلغ أعلى المدى: مجالُ تحسُّنه ضاق، فيُعاقَب في شرط الاتجاه بلا ذنب */
function atCeiling(k, r) {
  return k.unit === '٪' && k.better === 'up' && r.official && r.last >= 95 && r.trend < 2;
}

function kpiTable(c, el) {
  const ceil = el.rows.filter(r => atCeiling(r.k, r));
  return table([['المؤشّر'], ['د٦', 'c'], ['د٧', 'c'], ['د٨', 'c'], ['المستهدَف', 'c'], ['الاتجاه', 'c'], ['بلغ؟', 'c'], ['الحُجّية']],
    el.rows.map(r => {
      const k = r.k;
      return `<tr class="${r.official ? '' : 'is-out'}">
        <td><b>${esc(k.name)}</b>${SHARED.some(s => s.id === k.id) ? ' ' + pill('مشترك', 'i') : ''}${atCeiling(k, r) ? ' ' + pill('قُربَ السقف', 'a', 'بلغ ٩٥٪ فأكثر، ولم يُسجَّل له اتجاهٌ موجبٌ متّصل — لأنه لم يبقَ ما يصعده') : ''}</td>
        ${[0, 1, 2].map(i => `<td class="c n">${r.s ? unit(r.s[i], k) : '—'}</td>`).join('')}
        <td class="c n mut">${k.better === 'band' ? ar(k.band[0]) + '–' + ar(k.band[1]) : unit(k.target, k, 0)}</td>
        <td class="c">${spark(k, r.s)}</td>
        <td class="c">${r.official ? yn(r.met, 'نعم', 'لا') : '<span class="mut">—</span>'}</td>
        <td>${r.official ? pill('مصدرٌ رسميّ', 'g') : pill('غيرُ متوفّر رسمياً', 'r')}</td></tr>`;
    }))
    + (ceil.length ? note(`<b>أثرُ السقف — ${num(ceil.length, 'مؤشّرٌ واحد', 'مؤشّران', 'مؤشّراتٍ', 'مؤشّراً')} في هذه الحزمة.</b> بلغ ٩٥٪ فأكثر، ولم يُسجَّل له اتجاهٌ موجبٌ متّصل — <b>لا لتراجُع، بل لأنه لم يبقَ ما يصعده</b>. وشرطُ «الاتجاه الموجب لثلاث دورات» يعاقبه كما يعاقب المتراجع، فيتأهّل المتوسّطُ الصاعد ويسقط المتفوّقُ الثابت. هذه ثغرةٌ في المعيار لا في أداء الجهة، ومقترَحُ معالجتها — قراءةُ ما تجاوز ٩٥٪ «مستقرّاً عند التميّز» — مرفوعٌ إلى اللجنة العلمية ولم يُطبَّق في الحساب لأنه ليس في الدليل.`, 'a', 'warn') : '');
}

/* الاستمارة */
function formHtml(cid, sub) {
  const d = sub || DB.submissions[cid] || { sec: {}, files: [], at: null };
  const filled = FORM.filter(f => (d.sec[f.id] || '').trim().length > 40).length;
  const cover = Math.round(filled / FORM.length * 100);
  const need = FORM.length;

  return `
  <div class="rowj" style="margin-block-end:var(--s-4)">
    <div class="row" style="gap:var(--s-4)">
      <span class="tag"><i>الأقسام المكتملة</i><b class="num">${ar(filled)}/${ar(need)}</b></span>
      <span class="tag"><i>الأدلّة المرفوعة</i><b class="num">${ar(d.files.length)}</b></span>
    </div>
    ${d.at ? pill('أُرسِلت ' + dt(d.at), 'g') : btn('إرسال الاستمارة', `data-sub-send="${cid}"`, 'p')}
  </div>
  ${bar(cover, cover === 100 ? 'g' : 'ink')}
  <div class="hr"></div>
  <div class="form">${FORM.map(f => `
    <div class="fld">
      <label for="f-${f.id}">${esc(f.name)}
        ${f.adli !== '—' ? `<span class="pill pill--i" style="margin-inline-start:6px">يُقرأ بـ ${esc(f.adli)}</span>` : ''}</label>
      <em>${esc(f.q)}</em>
      <textarea id="f-${f.id}" data-sec="${f.id}" data-case="${cid}" placeholder="${esc(f.hint)}" ${d.at ? 'readonly' : ''}>${esc(d.sec[f.id] || '')}</textarea>
      <div class="sm mut">${ic('verdict')} ${esc(f.hint)}</div>
    </div>`).join('')}</div>
  <div class="hr"></div>
  <div class="up">
    <b style="font-size:12.5px">الأدلّة الداعمة</b>
    <p class="sm mut" style="margin:0">نصُّ الدليل: «أدلّةٌ داعمة لكلّ نتيجةٍ مُبلَّغٍ عنها». المنصّة لا تقبل إرسالَ الاستمارة قبل رفع دليلٍ واحدٍ على الأقلّ لكلّ نتيجةٍ في القسم الخامس.</p>
    ${d.at ? '' : `<div class="up__z" data-up="${cid}">${ic('clip')} أضِف دليلاً — محضرٌ، أو لقطةُ نظام، أو تقريرٌ مُعتمَد، أو سجلٌّ أصليّ</div>`}
    ${d.files.length ? d.files.map((f, i) => `<div class="up__f">${ic('file')}<b>${esc(f.n)}</b>
      <span>${esc(f.t)}</span>${d.at ? '' : `<button class="btn btn--sm" data-unfile="${cid}:${i}">حذف</button>`}</div>`).join('')
      : `<div class="empty" style="padding:var(--s-5)">${ic('clip')}<p>لا أدلّةَ بعد.</p></div>`}
  </div>`;
}

/* الزيارة الميدانية */
function visitHtml(cid, r) {
  const done = r.reviews && Object.keys(r.reviews).length;
  return `<div class="grid g-2">
    ${VISIT.map(v => `<div class="card card--flat">
      <div class="row" style="gap:6px;margin-block-end:4px">${ic('visit')}<b>${esc(v.name)}</b></div>
      <p class="sm mut" style="margin:0">${esc(v.q)}</p>
      ${done ? `<div class="row sm" style="margin-block-start:6px">
        <b class="num">${ar(Math.round(Object.values(r.reviews).reduce((a, x) => a + x.visit[v.k], 0) / Object.keys(r.reviews).length))}</b>
        <span class="mut">متوسّط الفريق من ١٠٠</span></div>` : ''}
    </div>`).join('')}
  </div>
  ${note('<b>الزيارةُ تحقُّقٌ لا استقبال.</b> بندُ «تتبُّع الرقم إلى مصدره» وحده يكشف أكثرَ ممّا يكشفه عرضٌ تقديميٌّ كامل: يُختار رقمٌ من الاستمارة عشوائياً، ويُطلَب سجلُّه الأصليّ. عدمُ القدرة على تتبّعه ليس نقصاً إدارياً — بل شكٌّ في النتيجة كلّها.', 'a', 'warn')}`;
}

/* التظلّم */
function appealBox(cid, r) {
  const mine = DB.appeals.filter(a => a.case === cid);
  const open = ['honored', 'winner', 'out2', 'out1', 'ineligible', 'blocked'].includes(r.state);
  return `${mine.length ? mine.map(a => `<div class="card card--flat" style="border-color:var(--am-200)">
      <div class="rowj"><b>تظلُّمٌ مُسجَّل</b>${pill(a.status, a.status === 'مقبول' ? 'g' : a.status === 'مرفوض' ? 'r' : 'a')}</div>
      <p class="sm" style="margin-block:6px 0">${esc(a.text)}</p>
      <div class="sm mut">${dt(a.at)} · ${esc(a.by)}</div>
      ${a.decision ? `<div class="hr" style="margin-block:var(--s-3)"></div><div class="sm"><b>قرارُ اللجنة:</b> ${esc(a.decision)}</div>` : ''}
    </div>`).join('') : ''}
  ${open ? `<div class="form" style="margin-block-start:${mine.length ? 'var(--s-4)' : '0'}">
    <div class="fld"><label for="ap-${cid}">نصُّ التظلّم</label>
      <em>حدِّد الإجراء المُعترَض عليه ورقم البند، لا الشعور بالنتيجة. التظلّم يُنظَر إجرائياً: هل طُبِّقت القاعدة كما نُشرَت؟</em>
      <textarea id="ap-${cid}" placeholder="مثال: الدرجة الموحَّدة في بند «التطبيق» اعتُمدت دون محضر توحيدٍ رغم تباعُدٍ يتجاوز العتبة المنشورة."></textarea></div>
    <div class="row" style="justify-content:flex-end">${btn('تقديم التظلّم', `data-appeal="${cid}"`)}</div>
  </div>` : `<div class="empty">${ic('lock')}<p>نافذةُ التظلّم تُفتَح بعد إعلان النتائج — ${dt(CYCLE.ceremony)}.</p></div>`}`;
}

</script>
<script>
/* جائزة أداء الصحة — عملُ اللجان: المكتب، والملفّ، وبطاقة التسجيل، والتوحيد */

const ANCHOR_MID = [12, 42, 70, 92];
const me = () => PEOPLE.find(p => p.id === ME) || PEOPLE[0];
const myRole = () => me().role;

/* الملفّات المُسنَدة إليّ */
function myCases() {
  const id = ME, role = myRole();
  const out = [];
  CATS.forEach(cat => boards()[cat.key].qualified.forEach(r => {
    const a = assignedTo(r.c.id);
    if (role === 'eval'   && a.evals.includes(id)) out.push({ r, a, as: 'مُقيِّم' });
    if (role === 'expert' && a.expert === id)      out.push({ r, a, as: 'خبيرُ توحيد' });
    if (role === 'chair'  || role === 'appeals')   out.push({ r, a, as: role === 'chair' ? 'إشراف' : 'مراجعة' });
  }));
  return out;
}

/* ============ المكتب ============ */
function viewDesk() {
  const role = myRole(), R = ROLES[role];

  if (role === 'entity') {
    const cs = CASES.filter(c => c.entity === me().entity);
    return `${pageHead('ملفّات جهتي', esc(E(me().entity).name))}
      ${card(head('المشاركات') + (cs.length ? table([['المسار'], ['الحالة'], ['المرحلة ١', 'c'], ['المرحلة ٢', 'c'], ['المركّبة', 'c'], ['', 'c']],
        cs.map(c => { const r = rowOf(c.id); return `<tr>
          <td><b>${esc(caseLabel(c))}</b></td><td>${stateBadge(r.state)}</td>
          <td class="c n">${fmt(r.s1s, 1)}</td><td class="c n">${fmt(r.s2s, 1)}</td><td class="c n"><b>${fmt(r.comp, 1)}</b></td>
          <td class="c"><a href="#/entity/${c.id}">افتح</a></td></tr>`; })) : empty('لا مشاركات.')))}`;
  }

  if (role === 'judge')   return viewJudging();
  if (role === 'appeals') return viewAppeals();
  if (role === 'sec')     return viewBoard();

  const mine = myCases();
  const pending = mine.filter(x => !(DB.reviews[x.r.c.id] || {})[ME]);
  const div = mine.filter(x => x.r.needsConsensus);

  return `
  ${pageHead('مكتبي · ' + R.name, R.desk,
    pill(COMMITTEES.find(c => c.id === R.comm)?.name || '—', 'g'))}

  <div class="grid g-4">
    ${stat(ar(mine.length), 'ملفٌّ مُسنَد', role === 'eval' ? 'مقيّمان لكل ملفّ' : 'ضمن نطاقي')}
    ${stat(ar(pending.length), 'بانتظار درجتي', pending.length ? 'لم تُرسَل بعد' : 'لا متأخّرات', pending.length ? 'red' : 'ink')}
    ${stat(ar(div.length), 'تباعُدٌ مفتوح', 'فوق ' + ar(CFG.divergence) + ' نقطة', div.length ? 'red' : '')}
    ${stat(ar(CATS.filter(c => boards()[c.key].confirmed).length), 'فئةٌ مُعتمَدة', 'من ' + ar(CATS.length))}
  </div>

  ${div.length ? card(head('يلزمه حوارُ توحيد', 'الدرجةُ لا تُعتمَد ما دام التباعُد مفتوحاً — والاعتمادُ فوقه ثغرةُ تظلّمٍ جاهزة.', pill('عاجل', 'r'))
    + table([['الجهة'], ['المسار'], ['مقيّم ١', 'c'], ['مقيّم ٢', 'c'], ['الفارق', 'c'], ['', 'c']],
      div.map(({ r }) => {
        const evs = Object.values(r.reviews).filter(x => x.by.startsWith('U-EV'));
        return `<tr><td><span class="ent">${esc(E(r.c.entity).name)}</span></td>
          <td>${esc(caseLabel(r.c))}</td>
          <td class="c n">${fmt(reviewScore(evs[0]), 1)}</td><td class="c n">${fmt(reviewScore(evs[1]), 1)}</td>
          <td class="c n"><b style="color:var(--r-500)">${fmt(r.divergence, 1)}</b></td>
          <td class="c"><a href="#/consensus/${r.c.id}">افتح الحوار</a></td></tr>`;
      })) ) : ''}

  ${card(head('الملفّات المُسنَدة', role === 'eval'
      ? 'تُقيَّم مستقلّاً خلف حجاب: لا ترى درجة زميلك قبل إرسال درجتك.'
      : 'كلُّ ملفٍّ يحمل مقيّمَيْن وخبيراً — وأنت الطرفُ الثالث.')
    + (mine.length ? table([['الجهة'], ['المسار'], ['دوري'], ['درجتي', 'c'], ['حالة الملفّ'], ['', 'c']],
      mine.slice(0, 40).map(({ r, as }) => {
        const rv = (DB.reviews[r.c.id] || {})[ME];
        return `<tr><td><span class="ent">${esc(E(r.c.entity).name)}<em>${esc(SECTORS[E(r.c.entity).sector].name)}</em></span></td>
          <td>${esc(caseLabel(r.c))}</td><td>${pill(as, 'i')}</td>
          <td class="c n">${rv ? '<b>' + fmt(reviewScore(rv), 1) + '</b>' : '<span class="mut">—</span>'}</td>
          <td>${stateBadge(r.state)}${r.needsConsensus ? ' ' + pill('تباعُد', 'r') : ''}</td>
          <td class="c"><a href="#/case/${r.c.id}">${rv ? 'راجِع' : 'قيِّم'}</a></td></tr>`;
      })) : empty('لا ملفّات مُسنَدة إليك.')))}

  ${role === 'chair' ? chairPanel() : ''}
  `;
}

/* لوحةُ رئيس اللجنة العلمية */
function chairPanel() {
  return card(head('اعتمادُ نتائج المرحلتين', 'رئيسُ اللجنة العلمية لا يمنح درجةً — يتحقّق من أن كلّ ملفٍّ استوفى شرطَ الاعتماد قبل رفعه إلى التحكيم.')
    + table([['المسار · الفئة'], ['متأهّل', 'c'], ['مُقيَّم', 'c'], ['تباعُدٌ مفتوح', 'c'], ['جاهزٌ للرفع', 'c'], ['', 'c']],
      CATS.map(cat => {
        const b = boards()[cat.key];
        const ready = b.counts.diverging === 0 && b.counts.scored >= Math.min(b.counts.qualified, STAGES[1].cut);
        return `<tr><td><b>${esc(catLabel(cat.key))}</b></td>
          <td class="c n">${ar(b.counts.qualified)}</td><td class="c n">${ar(b.counts.scored)}</td>
          <td class="c n">${b.counts.diverging ? '<b style="color:var(--r-500)">' + ar(b.counts.diverging) + '</b>' : ar(0)}</td>
          <td class="c">${yn(ready, 'جاهز', 'غيرُ جاهز')}</td>
          <td class="c"><a href="#/cat/${cat.key}">افتح</a></td></tr>`;
      }))
    + note('<b>شرطُ الرفع.</b> لا تُرفَع فئةٌ إلى لجنة التحكيم وفيها تباعُدٌ مفتوح. هذه ليست بيروقراطية: لجنةُ التحكيم تعتمد <b>ترتيباً</b>، وترتيبٌ مبنيٌّ على درجةٍ لم تُوحَّد هو ترتيبٌ بلا سند.', 'a', 'shield'));
}

/* ============ ملفّ المشاركة كما تراه اللجان ============ */
function viewCase(cid) {
  const c = CASE(cid); if (!c) return viewDesk();
  const r = rowOf(cid); if (!r) return viewDesk();
  const ent = E(c.entity), a = assignedTo(cid);
  const role = myRole();
  const mineRv = (DB.reviews[cid] || {})[ME];
  const canScore = (role === 'eval' && a.evals.includes(ME)) || (role === 'expert' && a.expert === ME);
  const seeOthers = role !== 'eval' || !!mineRv;   // الحجاب
  const seeWho = role !== 'judge';                // لجنةُ التحكيم تُقيّم الدرجة لا قائلَها

  const sub = DB.submissions[cid];

  return `
  ${pageHead(ent.name, `${esc(caseLabel(c, true))} · ملفُّ مشاركة <span class="num" dir="ltr">${esc(cid)}</span>`,
    stateBadge(r.state) + (r.needsConsensus ? pill('تباعُدٌ مفتوح', 'r') : ''),
    `<a href="#/desk">مكتبي</a> ${ic('arrow')} ملفّ`)}

  <div class="split">
    <div class="stack">
      ${card(head('نتائج المؤشّرات · المرحلة الأولى', 'مصدرُها المصادر الرسمية — لا تُعدَّل في المنصّة ولا تُقبَل مراجعتُها إلا بتصحيحٍ من المصدر.',
        `<span class="tag"><i>الدرجة</i><b class="num">${fmt(r.s1s, 1)}</b></span>`)
        + letciBreak(r.s1))}

      ${card(head('استمارة المشاركة', sub ? 'أُرسِلت في ' + dt(sub.at) : 'لم تُرسَل بعد.')
        + (sub ? FORM.map(f => `<div style="margin-block-end:var(--s-4)">
            <div class="row" style="gap:6px;margin-block-end:4px"><b>${esc(f.name)}</b>${f.adli !== '—' ? pill(f.adli, 'i') : ''}</div>
            <p class="sm" style="margin:0;color:var(--text-2)">${esc(sub.sec[f.id] || '') || '<span class="mut">— لم يُملأ —</span>'}</p>
          </div>`).join('') + (sub.files.length ? `<div class="hr"></div><b class="sm">الأدلّة</b>
            ${sub.files.map(f => `<div class="up__f">${ic('file')}<b>${esc(f.n)}</b><span>${esc(f.t)}</span></div>`).join('')}` : '')
          : empty('لم ترفع الجهةُ استمارتها بعد. التقييمُ يبقى مفتوحاً ولا يُحتسَب حتى تصل.')))}

      ${canScore ? card(head('بطاقة التسجيل — درجتي', mineRv ? 'مُرسَلة. التعديلُ يُسجَّل في السجلّ.' : 'اختر المرسى الوصفيّ لكل بُعد. المراسي تُثبِّت المعنى بين المقيّمين.',
          mineRv ? pill('أُرسِلت ' + dt(mineRv.at), 'g') : pill('لم تُرسَل', 'a'))
        + scorecard(cid)) : ''}
    </div>

    <div class="stack">
      ${card(head('الإسناد')
        + `<div class="stack">
          ${a.evals.map((u, i) => `<div class="rowj">${seeWho ? chip(u, 'مُقيِّم ' + ar(i + 1)) : chip({ name: 'مُقيِّم ' + ar(i + 1) }, 'الهويّة محجوبة عن لجنة التحكيم')}
            ${seeOthers && (DB.reviews[cid] || {})[u] ? `<b class="num">${fmt(reviewScore(DB.reviews[cid][u]), 1)}</b>`
              : `<span class="pill">${(DB.reviews[cid] || {})[u] ? (u === ME ? 'درجتي' : 'خلف الحجاب') : 'لم تُرسَل'}</span>`}</div>`).join('')}
          <div class="rowj">${seeWho ? chip(a.expert, 'خبير اللجنة العلمية') : chip({ name: 'خبير اللجنة العلمية' }, 'الهويّة محجوبة عن لجنة التحكيم')}
            ${seeOthers && (DB.reviews[cid] || {})[a.expert] ? `<b class="num">${fmt(reviewScore(DB.reviews[cid][a.expert]), 1)}</b>` : '<span class="pill">—</span>'}</div>
        </div>
        ${!seeWho ? note('<b>هويّةُ المُقيِّم محجوبةٌ عنك.</b> لجنةُ التحكيم تُراجع الدرجةَ ومبرَّرها، لا قائلَها — كي لا يُقاس الملفُّ بمكانة مَن قيّمه.', 'i', 'lock') : ''}
        ${!seeOthers ? note('<b>الحجاب مُفعَّل.</b> لن ترى درجةَ زميلك قبل إرسال درجتك. التقييمُ المزدوج يفقد قيمته لحظةَ يرى الثاني حكمَ الأول.', 'a', 'lock') : ''}
        <div class="hr"></div>
        <div class="sm mut">${ic('shield')} تعارضُ المصالح: استُبعِد من الإسناد كلُّ مُقيِّمٍ ينتمي إلى <b>${esc(ent.name)}</b>.</div>`)}

      ${card(head('الدرجات')
        + `<div class="row" style="gap:var(--s-5);justify-content:space-around;padding-block:var(--s-3)">
            ${dial(r.s1s, 68, 'المرحلة ١')}${dial(r.s2s, 68, 'المرحلة ٢')}${dial(r.comp, 78, 'المركّبة')}</div>
          <div class="hr"></div>
          ${kv([['مصدر درجة المرحلة ٢', esc(r.s2source)],
                ['التباعُد', r.divergence === null ? '<span class="mut">لم تكتمل درجتا المقيّمَيْن</span>' : `<b class="num" style="color:${r.divergence > CFG.divergence ? 'var(--r-500)' : 'inherit'}">${fmt(r.divergence, 1)}</b> نقطة · العتبة ${ar(CFG.divergence)}`],
                ['المرتبة في الفئة', r.rank2 ? ar(r.rank2) : r.rank1 ? ar(r.rank1) + ' (بالمرحلة ١)' : '—'],
                ['الوزن', `${pc(CFG.w1 * 100, 0)} + ${pc(CFG.w2 * 100, 0)}`]])}
          ${r.needsConsensus ? `<div class="hr"></div>${link('افتح حوار التوحيد', '#/consensus/' + cid, 'red')}` : ''}`)}

      ${card(head('السجلّ') + logHtml(cid, 6))}
    </div>
  </div>`;
}

/* تفصيل LeTCI للمرحلة الأولى */
function letciBreak(s1) {
  const w = CFG.letci;
  return `<div class="stack">${LETCI.map(d => {
    const v = s1.parts[d.k];
    return `<div class="dv__row" style="grid-template-columns:150px 1fr 88px">
      <div><b class="sm">${esc(d.name)}</b><div class="sm mut">${esc(d.en)} · وزن ${pc(w[d.k] * 100, 0)}</div></div>
      ${bar(v)}
      <div class="dv__n">${fmt(v, 1)}</div></div>`;
  }).join('')}
  <div class="hr" style="margin-block:var(--s-2)"></div>
  <div class="dv__row" style="grid-template-columns:150px 1fr 88px">
    <b class="sm">الدرجة المرجَّحة</b>${bar(s1.score, 'g')}<div class="dv__n"><b>${fmt(s1.score, 1)}</b></div></div></div>`;
}

/* ============ بطاقة التسجيل ============ */
function scorecard(cid) {
  const rv = (DB.reviews[cid] || {})[ME] || { adli: {}, letci: {}, visit: {}, note: '' };
  const sent = !!((DB.reviews[cid] || {})[ME] || {}).at;

  const group = (dims, key, title, weight) => `
    <div class="rowj" style="margin-block:var(--s-4) var(--s-2)">
      <b>${esc(title)}</b>${pill('وزن ' + pc(weight * 100, 0), 'i')}</div>
    <div class="rub">${dims.map(d => {
      const v = rv[key][d.k];
      const sel = v === undefined ? -1 : ANCHOR_MID.reduce((b, m, i) => Math.abs(m - v) < Math.abs(ANCHOR_MID[b] - v) ? i : b, 0);
      return `<div class="rub__row">
        <div class="rub__h"><span class="rub__k">${esc(d.k)}</span><b>${esc(d.name)}</b>
          <span class="sm mut">${esc(d.en || '')}</span>
          <span class="rub__val">${v === undefined ? '—' : ar(v)}</span></div>
        <div class="rub__q">${esc(d.q)}</div>
        <div class="rub__anch">${d.anchors.map((a, i) => `
          <button type="button" aria-pressed="${sel === i}" ${sent ? 'disabled' : ''}
            data-sc="${cid}|${key}|${d.k}|${ANCHOR_MID[i]}">
            <i>${ar([0, 30, 60, 85][i])}–${ar([25, 55, 80, 100][i])}</i>${esc(a)}</button>`).join('')}</div>
      </div>`;
    }).join('')}</div>`;

  const complete = [...ADLI, ...LETCI, ...VISIT].every(d =>
    (d.k in rv.adli) || (d.k in rv.letci) || (d.k in rv.visit));

  return `
  ${group(ADLI, 'adli', 'العمليات · ADLI', CFG.s2.adli)}
  ${group(LETCI, 'letci', 'النتائج · LeTCI', CFG.s2.letci)}
  ${group(VISIT.map(v => ({ ...v, anchors: ['لم يُتحقَّق', 'تحقُّقٌ جزئيّ', 'تحقُّقٌ كامل', 'تحقُّقٌ كاملٌ مع دليلٍ إضافيّ'] })), 'visit', 'الزيارة الميدانية', CFG.s2.visit)}
  <div class="hr"></div>
  <div class="fld"><label for="nt-${cid}">مبرَّرُ الدرجة</label>
    <em>يُقرأ في حوار التوحيد وفي التظلّم. درجةٌ بلا مبرَّرٍ لا تصمد أمام اعتراض.</em>
    <textarea id="nt-${cid}" data-note="${cid}" ${sent ? 'readonly' : ''}>${esc(rv.note || '')}</textarea></div>
  <div class="rowj">
    <span class="sm mut">${complete ? 'كلُّ الأبعاد مُسجَّلة.' : 'أكمِل كلّ الأبعاد قبل الإرسال.'}</span>
    ${sent ? pill('أُرسِلت — التعديل يُسجَّل', 'g')
           : btn('إرسالُ درجتي', `data-sc-send="${cid}" ${complete ? '' : 'disabled'}`, 'p')}
  </div>`;
}

/* ============ حوار التوحيد ============ */
function viewConsensus(cid) {
  const c = CASE(cid); if (!c) return viewDesk();
  const r = rowOf(cid); if (!r) return viewDesk();
  const a = assignedTo(cid);
  const rv = DB.reviews[cid] || {};
  const evs = a.evals.map(u => rv[u]).filter(Boolean);
  const ex = rv[a.expert];
  const cons = DB.consensus[cid];
  const canDo = ['expert', 'chair'].includes(myRole());

  if (evs.length < 2) return `${pageHead('حوار التوحيد')}${card(empty('لم تكتمل درجتا المقيّمَيْن بعد.'))}`;

  const rows = [
    ...ADLI.map(d => ({ d, key: 'adli' })),
    ...LETCI.map(d => ({ d, key: 'letci' })),
    ...VISIT.map(d => ({ d, key: 'visit' }))
  ].map(({ d, key }) => {
    const A = evs[0][key][d.k], B = evs[1][key][d.k], X = ex ? ex[key][d.k] : null;
    return { d, key, A, B, X, gap: Math.abs(A - B) };
  });
  const wide = rows.filter(x => x.gap > CFG.dimGap);

  return `
  ${pageHead('حوار التوحيد', `${esc(E(c.entity).name)} · ${esc(caseLabel(c))} — تباعُدٌ قدرُه <b class="num">${fmt(r.divergence, 1)}</b> نقطة، والعتبة ${ar(CFG.divergence)}.`,
    cons ? pill('مُوحَّدة', 'g') : pill('مفتوح', 'r'),
    `<a href="#/case/${cid}">الملفّ</a> ${ic('arrow')} التوحيد`)}

  ${note('<b>التباعُدُ ليس خطأً يُخفى.</b> فرقٌ واسعٌ بين مقيّمَيْن قرآ الملفّ نفسه يعني أن البند نفسه يحتمل قراءتين — إمّا لأن الدليل ناقص، أو لأن المرسى الوصفيّ غامض. الحوارُ يفصل بين الحالتين، والمبرَّرُ المكتوب هو ما يُقرأ في التظلّم بعد أشهر.', 'i', 'split')}

  <div class="split">
    <div class="stack">
      ${card(head('الأبعاد المتباعدة',
          wide.length ? `${num(wide.length, 'بُعدٌ واحد', 'بُعدان', 'أبعادٍ', 'بُعداً')} تباعَدَ فيه المقيّمان بأكثر من خطوةِ مرسًى — خلافٌ في قراءة البند، ويُناقَش أوّلاً.`
                      : 'لا بُعدَ تباعَدَ فيه المقيّمان بأكثر من خطوةِ مرسًى واحدة: التباعُدُ متراكمٌ من فروقٍ صغيرة متّسقة الاتجاه — وهذه شدّةُ مُقيِّمٍ لا خلافُ قراءة، وهي أصعبُ الحالتين.')
        + `<div class="dv">
          ${rows.map(x => {
            const lo = Math.min(x.A, x.B), hi = Math.max(x.A, x.B);
            return `<div class="dv__row" style="${x.gap > CFG.divergence ? 'background:var(--r-50);border-radius:var(--r-xs);padding-block:3px' : ''}">
              <div><b class="sm">${esc(x.d.name)}</b><div class="sm mut">${esc(x.key === 'adli' ? 'عمليات' : x.key === 'letci' ? 'نتائج' : 'زيارة')} · ${esc(x.d.k)}</div></div>
              <div class="dv__t">
                <s style="inset-inline-start:${lo}%;inline-size:${hi - lo}%"></s>
                <b class="a" style="inset-inline-start:${x.A}%"></b>
                <b class="b" style="inset-inline-start:${x.B}%"></b>
                ${x.X !== null ? `<b class="c" style="inset-inline-start:${x.X}%"></b>` : ''}
              </div>
              <div class="dv__n" style="color:${x.gap > CFG.dimGap ? 'var(--r-500)' : 'inherit'}">${ar(x.gap)}</div>
            </div>`;
          }).join('')}
          <div class="dv__lg"><span><i style="background:var(--ink-500)"></i>مقيّم ١</span>
            <span><i style="background:var(--au-500)"></i>مقيّم ٢</span>
            <span><i style="background:var(--g-600)"></i>خبير اللجنة العلمية</span>
            <span><i style="background:var(--r-200)"></i>مدى التباعُد</span></div>
        </div>`)}

      ${card(head('مبرَّرات المقيّمين', 'تُقرأ قبل أيّ نقاشٍ في الرقم — فالخلافُ في القراءة لا في الحساب.')
        + [...evs.map((v, i) => ({ v, l: 'مُقيِّم ' + ar(i + 1) })), ...(ex ? [{ v: ex, l: 'خبير اللجنة العلمية' }] : [])]
          .map(({ v, l }) => `<div class="card card--flat" style="margin-block-end:var(--s-2)">
            <div class="rowj" style="margin-block-end:4px">${myRole() === 'judge' ? chip({ name: l }, 'الهويّة محجوبة') : chip(v.by, l)}<b class="num">${fmt(reviewScore(v), 1)}</b></div>
            <p class="sm mut" style="margin:0">${esc(v.note) || '<em>لم يُكتَب مبرَّر — وهذه في ذاتها ملاحظةٌ على جودة التقييم.</em>'}</p>
          </div>`).join(''))}
    </div>

    <div class="stack">
      ${card(head('الدرجة الموحَّدة', cons ? 'اعتُمِدت.' : canDo ? 'تُسجَّل بعد الحوار، ومعها مبرَّرٌ إلزاميّ.' : 'يُديرها خبيرُ اللجنة العلمية أو رئيسها.')
        + (cons ? `<div class="row" style="justify-content:center;padding-block:var(--s-3)">${dial(reviewScore(cons), 84, 'الموحَّدة')}</div>
            ${kv([['وحَّدها', esc((PEOPLE.find(p => p.id === cons.by) || {}).name || cons.by)], ['التاريخ', dt(cons.at)]])}
            <div class="hr"></div><b class="sm">المبرَّر</b><p class="sm mut">${esc(cons.rationale)}</p>`
          : canDo ? `
            <p class="sm mut">تُقترَح البدايةُ من متوسّط المقيّمَيْن، ولا تُعتمَد إلا بمبرَّر.</p>
            <div class="row" style="justify-content:center;padding-block:var(--s-3)">${dial((reviewScore(evs[0]) + reviewScore(evs[1])) / 2, 84, 'المقترَحة')}</div>
            <div class="fld"><label for="cs-r">مبرَّرُ التوحيد <span>*</span></label>
              <em>ما الذي حسم الخلاف: دليلٌ جديد، أم قراءةٌ مصحّحة للمرسى، أم نقصٌ في الاستمارة؟</em>
              <textarea id="cs-r" placeholder="مثال: اتّفق المقيّمان بعد مراجعة المحضر رقم ٤ على أن التطبيق يشمل ثلاث وحداتٍ لا خمساً، فاستقرّ البُعد D عند ٦٠."></textarea></div>
            <div class="row" style="justify-content:flex-end">${btn('اعتمادُ الدرجة الموحَّدة', `data-cons="${cid}"`, 'p')}</div>`
          : note('هذه الصفحة للاطّلاع فقط بدورك الحاليّ. تسجيلُ التوحيد صلاحيةُ خبير اللجنة العلمية ورئيسها.', 'n', 'lock')))}

      ${card(head('أثرُ التوحيد على الترتيب', 'التباعُدُ لا يُغيِّر درجةً فحسب — قد يُغيِّر مَن يبلغ الخمسة.')
        + (() => {
            const b = boards()[c.key];
            const all = b.qualified.filter(x => x.comp !== null).sort((a2, b2) => b2.comp - a2.comp);
            const near = all.slice(0, 7);
            const self = all.find(x => x.c.id === cid);
            if (self && !near.includes(self)) near.push(self);
            const cut = STAGES[1].cut;
            return table([['#', 'c'], ['الجهة'], ['المركّبة', 'c']],
              near.map((x, i) => `<tr class="${x.c.id === cid ? 'is-win' : ''} ${(x.rank2 || 0) > cut ? 'is-out' : ''}">
                <td class="c"><span class="rk ${x.rank2 === 1 ? 'rk--top' : ''}">${ar(x.rank2 || '—')}</span></td>
                <td>${esc(E(x.c.entity).name)}${x.c.id === cid ? ' ' + pill('هذا الملفّ', 'i') : ''}</td>
                <td class="c n">${fmt(x.comp, 1)}</td></tr>`))
              + `<p class="sm mut" style="margin-block-start:var(--s-2)">الخطُّ الفاصل بعد المرتبة ${ar(cut)} — وما دونه خارج المرحلة الثالثة.</p>`;
          })())}
    </div>
  </div>`;
}

/* السجلّ */
function logHtml(cid, n = 12) {
  const rows = DB.log.filter(l => !cid || l.on === cid).slice(0, n);
  if (!rows.length) return `<div class="empty" style="padding:var(--s-5)">${ic('log')}<p>لا حركاتٍ مُسجَّلة بعد في هذه الجلسة.</p></div>`;
  return `<div class="stack">${rows.map(l => `
    <div class="row sm" style="gap:var(--s-3);align-items:flex-start">
      <span class="mut num" style="min-inline-size:96px">${esc(l.at)}</span>
      <div><b>${esc(l.act)}</b> <span class="mut">— ${esc(l.who)}</span>
        ${l.detail ? `<div class="mut">${esc(l.detail)}</div>` : ''}</div></div>`).join('')}</div>`;
}

</script>
<script>
/* جائزة أداء الصحة — لوحة الجائزة، وقاعة التحكيم، والحجب والتظلّم، والسجلّ */

/* ============ جدول ترتيبٍ مشترك ============ */
function boardTable(b, full = false) {
  const rows = b.rows.slice().sort((x, y) => {
    const o = { winner: 0, honored: 1, finalist: 2, qualified: 3, out2: 4, out1: 5, ineligible: 6, blocked: 7 };
    return (o[x.state] - o[y.state]) || (y.s1s - x.s1s);
  });
  if (!rows.length) return empty('لا مشاركات في هذا المسار.');

  return table([['#', 'c'], ['الجهة'], ['القطاع'], ['الحالة'], ['م١', 'c'], ['م٢', 'c'], ['المركّبة', 'c'], ['التباعُد', 'c'], ['', 'c']],
    rows.map((r, i) => {
      const ent = E(r.c.entity);
      const cut = full && b.qualified.length && r.c.id === b.qualified[b.qualified.length - 1].c.id;
      const win = ['winner', 'honored'].includes(r.state);
      const out = ['out1', 'out2', 'ineligible'].includes(r.state);
      return `<tr class="${cut ? 'is-cut' : ''} ${win ? 'is-win' : ''} ${out ? 'is-out' : ''}">
        <td class="c"><span class="rk ${r.finalPos === 0 ? 'rk--top' : ''}">${r.rank2 ? ar(r.rank2) : r.rank1 ? ar(r.rank1) : '—'}</span></td>
        <td><span class="ent">${esc(ent.name)}<em>${esc(ent.region)}</em></span></td>
        <td class="sm mut">${esc(SECTORS[ent.sector].name)}</td>
        <td>${stateBadge(r.state)}</td>
        <td class="c n">${fmt(r.s1s, 1)}</td>
        <td class="c n">${fmt(r.s2s, 1)}</td>
        <td class="c n"><b>${fmt(r.comp, 1)}</b></td>
        <td class="c n">${r.divergence === null ? '—' : `<span style="color:${r.needsConsensus ? 'var(--r-500)' : 'var(--text-3)'}">${fmt(r.divergence, 1)}</span>`}</td>
        <td class="c"><a href="#/case/${r.c.id}">افتح</a></td></tr>`;
    }));
}

/* ============ لوحة الجائزة ============ */
function viewBoard() {
  const st = cycleStats(), b = boards();
  const maxAll = Math.max(...CATS.map(c => b[c.key].counts.all));

  return `
  ${pageHead('لوحة الجائزة', 'حالةُ الدورة الثامنة في مسارٍ واحد: من سجّل، ومن اجتاز الأهليّة، ومن تأهّل، ومن بلغ التحكيم، ومن فاز. والتصفيةُ تجري داخل <b>الفئة</b> لا المسار.',
    link('النتائج المعلنة', '#/results', 'gold') + link('السجلّ', '#/log') + link('الحجب والتظلّم', '#/appeals'))}

  <div class="grid g-6">
    ${stat(ar(st.entities), 'جهةٌ مُسجَّلة')}
    ${stat(ar(st.cases), 'ملفّ مشاركة', ar(st.cats) + ' فئات')}
    ${stat(ar(st.eligible), 'اجتاز الأهليّة', pc(st.eligible / st.cases * 100, 0), 'ink')}
    ${stat(ar(st.qualified), 'متأهّلٌ للمرحلة ٢', 'أفضل ١٠/فئة', 'ink')}
    ${stat(ar(st.finalists), 'بلغ التحكيم', 'أفضل ٥/فئة', 'gold')}
    ${stat(ar(st.diverging), 'تباعُدٌ مفتوح', st.diverging ? 'يوقف الاعتماد' : 'لا شيء', st.diverging ? 'red' : '')}
  </div>

  ${card(head('القِمع في الفئات العشر', 'العرضُ الأفقيّ يقيس عدد المسجّلين، والدرجاتُ اللونيّة تقيس عمق التصفية. لكلّ فئةٍ ترتيبُها وفائزُها.')
    + TRACKS.map(t => {
        const tt = trackTotals(t.id);
        return `<div style="margin-block-end:var(--s-4)">
          <div class="rowj" style="margin-block-end:6px">
            <a href="#/track/${t.id}" style="font-weight:600;font-size:13px;color:inherit;text-decoration:none">${ic('track')} ${esc(t.name)}</a>
            <span class="sm mut">${ar(tt.all)} مُسجَّلاً · ${ar(tt.eligible)} مؤهَّلاً${t.cats.length > 1 ? ' · ' + num(t.cats.length, '', 'فئتان', 'فئاتٍ', 'فئةً') : ''}</span>
          </div>
          <div class="funnel">${t.cats.map(cat => {
            const bb = b[cat.key], c = bb.counts;
            const seg = [[bb.confirmed ? 3 : 0, 4], [c.finalists - (bb.confirmed ? 3 : 0), 3], [c.qualified - c.finalists, 2], [c.eligible - c.qualified, 1], [c.all - c.eligible, 0]];
            return `<div class="fn fn--k fn--seg">
              <div class="fn__l"><a href="#/cat/${cat.key}" style="color:inherit;text-decoration:none">${esc(t.cats.length > 1 ? cat.short : 'الفئة العامة')}</a>
                <em>${esc(cat.unit === 'cluster' ? 'تجمّعات' : cat.unit === 'hospital' ? 'منشآت مفردة' : 'تجمّعاتٌ ومنشآت')} · ${ar(c.all)} مُسجَّلاً</em></div>
              <div class="fn__t">
                ${seg.map(([n, i]) => n > 0 ? `<i style="flex:${n};background:${['var(--n-300)', 'var(--ink-200)', 'var(--ink-400)', 'var(--ink-700)', 'linear-gradient(90deg,var(--au-500),var(--au-300))'][i]}" title="${['خارج الأهليّة', 'خرج بعد م١', 'خرج بعد م٢', 'بلغ التحكيم', 'مُكرَّم'][i]}: ${n}"></i>` : '').join('')}
                <i style="flex:${Math.max(0, maxAll - c.all)};background:transparent"></i>
              </div>
              <div class="fn__n">${bb.confirmed ? `<span style="color:var(--au-600)">${ar(3)}</span>` : `<span class="mut">${ar(c.finalists)}</span>`}</div>
            </div>`;
          }).join('')}</div></div>`;
      }).join('')
    + `<div class="dv__lg" style="margin-block-start:var(--s-3)">
      <span><i style="background:var(--au-400)"></i>مُكرَّم</span>
      <span><i style="background:var(--ink-700)"></i>بلغ التحكيم</span>
      <span><i style="background:var(--ink-400)"></i>خرج بعد المرحلة ٢</span>
      <span><i style="background:var(--ink-200)"></i>خرج بعد المرحلة ١</span>
      <span><i style="background:var(--n-300)"></i>لم يجتز الأهليّة</span>
    </div>`)}

  ${card(head('الترتيب الكامل', `${nCase(st.cases)} · مرتَّبةٌ بالحالة ثم بالدرجة`,
      `<select class="top__sel" data-bfilter>
        <option value="">كلُّ الفئات</option>
        ${CATS.map(c => `<option value="${c.key}" ${BFILTER === c.key ? 'selected' : ''}>${esc(catLabel(c.key))}</option>`).join('')}
      </select>`)
    + (BFILTER ? boardTable(b[BFILTER], true) : allTable()))}
  `;
}

/* ============ صفحةُ فئة ============ */
function viewCat(key) {
  const cat = C(key); if (!cat) return viewBoard();
  const t = T(cat.track), b = boards()[key];
  const st = STAGES;
  const funnel = [
    ['سجّل في الفئة', b.counts.all, 0, 'تسجيلٌ مفتوحٌ لكلّ ' + (cat.unit === 'cluster' ? 'التجمّعات' : cat.unit === 'hospital' ? 'المنشآت المفردة' : 'الجهات')],
    ['اجتاز الأهليّة', b.counts.eligible, 1, 'ثلاثةُ شروطٍ قاطعة'],
    [st[0].cutLabel, b.counts.qualified, 2, 'المرحلة الأولى · مؤشّرات الأداء'],
    [st[1].cutLabel, b.counts.finalists, 3, 'المرحلة الثانية · تقييم الأنظمة'],
    [st[2].cutLabel, b.confirmed ? 3 : 0, 4, 'المرحلة الثالثة · التحكيم']
  ];
  const max = b.counts.all || 1;

  return `
  ${pageHead(t.cats.length > 1 ? cat.name : t.name, t.aim,
    pill(cat.unit === 'cluster' ? 'وحدةُ التنافس: التجمّع الصحيّ' : cat.unit === 'hospital' ? 'وحدةُ التنافس: المنشأة المفردة' : 'وحدةُ التنافس: تجمّعاتٌ ومنشآت', 'i')
    + link('كلُّ فئات المسار', '#/track/' + t.id),
    `<a href="#/board">لوحة الجائزة</a> ${ic('arrow')} <a href="#/track/${t.id}">${esc(t.short)}</a> ${ic('arrow')} ${esc(cat.short)}`)}

  ${card(head('القِمع', 'التصفيةُ تجري داخل الفئة — فالمنافسة بين نظراء يُقاسون بالحزمة نفسها.')
    + `<div class="funnel">${funnel.map(([l, n, i, sub]) => `
      <div class="fn fn--${i}">
        <div class="fn__l">${esc(l)}<em>${esc(sub)}</em></div>
        <div class="fn__t"><i style="inline-size:${(n / max * 100).toFixed(1)}%"></i></div>
        <div class="fn__n">${ar(n)}</div>
      </div>`).join('')}</div>
    ${b.counts.eligible < st[0].cut
      ? note(`<b>حالةٌ يجب أن تُعلَن لا أن تُغطّى.</b> عددُ المؤهّلين في هذه الفئة ${ar(b.counts.eligible)} — أقلُّ من عتبة «أفضل ${ar(st[0].cut)}». المنصّة لا تُكمِل العددَ بجهاتٍ غير مؤهّلة: تأهّل من استوفى.`, 'a', 'warn')
      : ''}`)}

  ${card(head('حزمة المؤشّرات', `${num(cat.kpis.length, 'مؤشّرٌ واحد', 'مؤشّران', 'مؤشّراتٍ', 'مؤشّراً')} خاصّةٌ بالفئة، وثلاثةٌ مشتركةٌ تُقاس في كلّ الفئات.`)
    + table([['المؤشّر'], ['المستهدَف الوطنيّ', 'c'], ['الاتجاه', 'c'], ['قراءةُ الأفضل']],
      kpisOf(key).map(k => {
        const shared = SHARED.some(x => x.id === k.id);
        return `<tr>
          <td><b>${esc(k.name)}</b> ${shared ? pill('مشترك', 'i') : ''}</td>
          <td class="c n">${k.better === 'band' ? ar(k.band[0]) + '–' + ar(k.band[1]) : unit(k.target, k, k.unit === 'يوم' ? 1 : 0)}</td>
          <td class="c">${ic(k.better === 'down' ? 'down' : k.better === 'band' ? 'flat' : 'up')}</td>
          <td class="mut sm">${k.better === 'band' ? 'نطاقٌ ذو حدَّين — الأقلّ سعةٌ معطّلة، والأكثر نظامٌ بلا احتياطي'
            : k.better === 'down' ? 'كلّما قلَّ كان أفضل' : 'كلّما زاد كان أفضل'}</td></tr>`;
      })))}

  ${CAN.board.includes(myRole())
    ? card(head('الترتيب', `${nCase(b.counts.all)} في هذه الفئة · ${ar(b.counts.eligible)} اجتاز الأهليّة`) + boardTable(b, true))
    : card(head('الترتيب', 'محجوبٌ عن دورك الحاليّ.')
        + note('المُقيِّمُ الذي يعرف موقعَ الجهة قبل أن يضع درجتَه يُقيِّم الموقعَ لا الملفّ. بندٌ في مصفوفة الصلاحيات، مفروضٌ هنا لا مكتوبٌ فقط.', 'i', 'lock'))}
  `;
}

function allTable() {
  const rows = [];
  CATS.forEach(c => boards()[c.key].rows.forEach(r => rows.push(r)));
  const o = { winner: 0, honored: 1, finalist: 2, qualified: 3, out2: 4, out1: 5, ineligible: 6, blocked: 7 };
  rows.sort((x, y) => (o[x.state] - o[y.state]) || ((y.comp ?? y.s1s) - (x.comp ?? x.s1s)));
  return table([['الجهة'], ['المسار · الفئة'], ['الحالة'], ['م١', 'c'], ['م٢', 'c'], ['المركّبة', 'c'], ['', 'c']],
    rows.slice(0, 60).map(r => {
      const ent = E(r.c.entity), win = ['winner', 'honored'].includes(r.state);
      return `<tr class="${win ? 'is-win' : ''} ${['out1', 'out2', 'ineligible'].includes(r.state) ? 'is-out' : ''}">
        <td><span class="ent">${esc(ent.name)}<em>${esc(SECTORS[ent.sector].name)}</em></span></td>
        <td class="sm">${esc(caseLabel(r.c))}</td>
        <td>${stateBadge(r.state)}</td>
        <td class="c n">${fmt(r.s1s, 1)}</td><td class="c n">${fmt(r.s2s, 1)}</td>
        <td class="c n"><b>${fmt(r.comp, 1)}</b></td>
        <td class="c"><a href="#/case/${r.c.id}">افتح</a></td></tr>`;
    })) + `<p class="sm mut" style="margin-block-start:var(--s-3)">تُعرَض أوّلُ ٦٠ صفّاً — اختر فئةً لترى ترتيبَها كاملاً.</p>`;
}

/* ============ قاعة التحكيم ============ */
function viewJudging() {
  const b = boards();
  const isChair = ME === 'U-JD1';

  return `
  ${pageHead('قاعة التحكيم · المرحلة الثالثة',
    'مراجعةٌ نهائية من لجنة التحكيم لتأكيد الجهات الفائزة واعتماد أوجه التكريم. اللجنةُ لا تُعيد التقييم — تتحقّق من سلامة العملية وتعتمد الترتيب أو تعدّله بمبرَّرٍ مُسجَّل.',
    pill(isChair ? 'رئيس اللجنة' : 'عضو', isChair ? 'au' : 'i'))}

  ${note('<b>ما الذي أمام اللجنة؟</b> خمسةُ ملفّاتٍ لكلّ <b>فئة</b> — لا لكلّ مسار، فمسارٌ ذو ثلاث فئاتٍ تُعرَض عليه خمسةَ عشرَ ملفّاً وثلاثةُ تتويجاتٍ منفصلة، ولكلٍّ درجةٌ مركّبة نصفُها من مؤشّراتٍ رسمية ونصفُها من تقييمٍ بشريٍّ مُوحَّد. الترتيبُ المعروض هو ناتجُ الحساب — وصلاحيةُ اللجنة أن تعتمده أو تُخالفه، بشرطِ مبرَّرٍ يُسجَّل ويُقرأ في التظلّم.', 'i', 'gavel')}

  ${TRACKS.map(t => t.cats.map(cat => judgeCat(t, cat, b[cat.key], isChair)).join('')).join('')}
  `;
}

function judgeCat(t, cat, b, isChair) {
  const key = cat.key;
  const fin = b.finalists;
  if (!fin.length) return card(head(catLabel(key, true)) + empty('لم يبلغ هذه الفئةَ متأهّلون بعد.'));

  const myBallot = (DB.ballots[key] || {})[ME];
  const ids = fin.map(r => r.c.id);
  const order = myBallot || ids.slice();
  const bal = DB.ballots[key] || {};
  const cast = Object.keys(bal).length;
  const judges = PEOPLE.filter(p => p.role === 'judge').length;

  const pts = {}; ids.forEach(i => pts[i] = 0);
  Object.values(bal).forEach(l => l.forEach((id, i) => { if (pts[id] !== undefined) pts[id] += ids.length - i; }));
  const tally = ids.slice().sort((a, c) => pts[c] - pts[a]);
  const conf = DB.confirmed[key];

  return card(head(catLabel(key, true),
      conf ? `اعتُمِد في ${dt(conf.at)} — ${esc(conf.rationale)}` : `${ar(cast)} من ${ar(judges)} محكّمين أدلَوا ببطاقاتهم.`,
      conf ? pill('مُعتمَد', 'g') : cast === judges ? pill('جاهزٌ للاعتماد', 'a') : pill('بانتظار البطاقات', ''))
    + `<div class="split" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)">
      <div>
        <b class="sm">بطاقتي — رتِّب الخمسة</b>
        <p class="sm mut">الترتيبُ الأوّليّ هو ترتيبُ الدرجة المركّبة. حرِّكه إن رأيتَ ما لا يلتقطه الرقم — واكتب سببَك.</p>
        <div class="stack" style="margin-block-start:var(--s-3)">
          ${order.map((id, i) => {
            const r = fin.find(x => x.c.id === id);
            return `<div class="row" style="gap:var(--s-2);padding:7px var(--s-3);border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)">
              <span class="rk ${i === 0 ? 'rk--top' : ''}">${ar(i + 1)}</span>
              <div style="flex:1;min-inline-size:0"><span class="ent">${esc(E(r.c.entity).name)}</span></div>
              <span class="num sm mut">${fmt(r.comp, 1)}</span>
              ${conf ? '' : `<button class="btn btn--sm" data-bal="${key}|${i}|-1" ${i === 0 ? 'disabled' : ''}>▲</button>
              <button class="btn btn--sm" data-bal="${key}|${i}|1" ${i === order.length - 1 ? 'disabled' : ''}>▼</button>`}
            </div>`;
          }).join('')}
        </div>
        ${conf ? '' : `<div class="row" style="justify-content:flex-end;margin-block-start:var(--s-3)">
          ${btn(myBallot ? 'تحديثُ بطاقتي' : 'إيداعُ بطاقتي', `data-bal-send="${key}"`, 'p')}</div>`}
      </div>

      <div>
        <b class="sm">المحصّلة</b>
        <p class="sm mut">تُحسَب بنقاط بوردا: المركزُ الأول من كلّ بطاقةٍ ${ar(ids.length)} نقاط، والأخير نقطةٌ واحدة.</p>
        ${cast ? table([['#', 'c'], ['الجهة'], ['نقاط', 'c'], ['المركّبة', 'c'], ['التكريم', 'c']],
          (conf ? conf.order : tally).map((id, i) => {
            const r = fin.find(x => x.c.id === id);
            return `<tr class="${i < 3 && conf ? 'is-win' : ''}">
              <td class="c"><span class="rk ${i === 0 ? 'rk--top' : ''}">${ar(i + 1)}</span></td>
              <td>${esc(E(r.c.entity).name)}</td>
              <td class="c n">${ar(pts[id] || 0)}</td>
              <td class="c n">${fmt(r.comp, 1)}</td>
              <td class="c">${conf && i < 3 ? `<span class="bdg bdg--gold">${ic('medal')}${esc(HONORS[i].name)}</span>` : '<span class="mut">—</span>'}</td></tr>`;
          })) : empty('لم تُودَع بطاقاتٌ بعد.')}
        ${!conf && isChair && cast && b.counts.diverging ? note(`<b>الاعتمادُ موقوف.</b> في هذه الفئة ${ar(b.counts.diverging)} ملفّاً بتباعُدٍ مفتوحٍ بين المقيّمَيْن. لجنةُ التحكيم تعتمد <b>ترتيباً</b>، وترتيبٌ مبنيٌّ على درجةٍ لم تُوحَّد هو ترتيبٌ بلا سند. تُغلَق الحوارات من مكتب اللجنة العلمية أوّلاً.`, 'r', 'shield') : ''}
        ${!conf && isChair && cast && !b.counts.diverging ? `
          <div class="fld" style="margin-block-start:var(--s-3)"><label for="cf-${key}">مبرَّرُ الاعتماد <span>*</span></label>
            <em>إن خالف الاعتمادُ محصّلةَ البطاقات فالمبرَّرُ شرطُ صحّة، لا صيغةٌ إنشائية.</em>
            <textarea id="cf-${key}" placeholder="مثال: اعتُمِدت المحصّلة كما هي بعد التحقّق من اكتمال محاضر التوحيد في الملفّات الخمسة."></textarea></div>
          <div class="row" style="justify-content:flex-end">${btn('اعتمادُ الفائزين وأوجه التكريم', `data-confirm="${key}"`, 'gold')}</div>` : ''}
        ${!conf && !isChair ? note('الاعتمادُ صلاحيةُ رئيس لجنة التحكيم وحده. بطاقتك تدخل المحصّلة.', 'n', 'lock') : ''}
        ${conf ? note(`<b>اعتُمِد.</b> ${esc(conf.rationale)}`, 'g', 'check') : ''}
      </div>
    </div>`, conf ? 'card--gold' : '');
}

/* ============ الحجب والتظلّم ============ */
function viewAppeals() {
  const blocked = Object.keys(OVERRIDE).map(id => rowOf(id)).filter(Boolean);
  const can = ['appeals', 'sec'].includes(myRole());

  return `
  ${pageHead('الحجب والتظلّم',
    `تتولّى اللجنةُ النظرَ في حالات الحجب والتظلّمات، والتحقّق من سلامة الإجراءات وفق الضوابط المعتمدة. تُقدَّم التظلّمات خلال ${ar(CYCLE.appealWeeks)} أسابيع من تاريخ حفل الجائزة وإعلان النتائج.`)}

  <div class="grid g-4">
    ${stat(ar(blocked.length), 'ملفٌّ محجوب', '', blocked.length ? 'red' : '')}
    ${stat(ar(DB.appeals.length), 'تظلُّمٌ مُقدَّم')}
    ${stat(ar(DB.appeals.filter(a => a.status === 'قيد النظر').length), 'قيد النظر', '', 'ink')}
    ${stat(ar(CYCLE.appealWeeks), 'أسابيع النافذة', 'من ' + dt(CYCLE.ceremony))}
  </div>

  ${note(`<b>النافذةُ مفتوحةٌ الآن.</b> أُعلِنت نتائجُ الدورة الثامنة في ${dt(CYCLE.ceremony)}، فبدأت مدّةُ التظلّم ${ar(CYCLE.appealWeeks)} أسابيع وتنتهي ${dt(CYCLE.appealEnds)}. وما بقي من المدّة هو ما يملكه المتظلِّم — لا أكثر.`, 'a', 'warn')}

  ${card(head('نافذة التظلّم', 'المدّةُ تبدأ من تاريخ حفل الجائزة وإعلان النتائج، لا من تاريخ التبليغ الفرديّ.')
    + kv([
      ['بداية النافذة', dt(CYCLE.ceremony)],
      ['نهايتها', dt(CYCLE.appealEnds)],
      ['القناة', `<span class="num" dir="ltr">${CYCLE.email}</span>`],
      ['ما يُنظَر فيه', 'سلامةُ الإجراء: هل طُبِّقت القاعدة المنشورة كما نُشِرت؟'],
      ['ما لا يُنظَر فيه', 'إعادةُ التقييم الموضوعيّ — التظلّمُ ليس فرصةَ تقييمٍ ثانية.']
    ]))}

  ${card(head('الملفّات المحجوبة', 'الحجبُ إجراءٌ استثنائيّ، ويبقى الملفُّ ظاهراً في اللوحة بحالته — الحذفُ الصامت يُفسِد الأثر.')
    + (blocked.length ? table([['الجهة'], ['المسار'], ['الحالة قبل الحجب'], ['', 'c']],
      blocked.map(r => `<tr><td><span class="ent">${esc(E(r.c.entity).name)}</span></td>
        <td>${esc(caseLabel(r.c))}</td>
        <td>${pill('كان ضمن المتأهّلين', 'a')}</td>
        <td class="c"><a href="#/entity/${r.c.id}">الملفّ</a></td></tr>`)) : empty('لا ملفّات محجوبة.')))}

  ${card(head('التظلّمات', can ? 'لك أن تبتّ في التظلّم بقرارٍ مُسبَّب.' : 'تُعرَض للاطّلاع بدورك الحاليّ.')
    + (DB.appeals.length ? DB.appeals.map((a, i) => `
      <div class="card card--flat" style="margin-block-end:var(--s-2);border-color:${a.status === 'قيد النظر' ? 'var(--am-200)' : 'var(--line)'}">
        <div class="rowj">
          <div><b>${esc(E(CASE(a.case).entity).name)}</b> <span class="mut sm">· ${esc(caseLabel(CASE(a.case)))}</span></div>
          ${pill(a.status, a.status === 'مقبول' ? 'g' : a.status === 'مرفوض' ? 'r' : 'a')}
        </div>
        <p class="sm" style="margin-block:6px">${esc(a.text)}</p>
        <div class="sm mut">${dt(a.at)} · ${esc(a.by)}</div>
        ${a.decision ? `<div class="hr" style="margin-block:var(--s-3)"></div>
          <div class="sm"><b>قرارُ اللجنة:</b> ${esc(a.decision)}</div>` : can ? `
          <div class="hr" style="margin-block:var(--s-3)"></div>
          <div class="fld"><label for="dc-${i}">قرارٌ مُسبَّب</label>
            <textarea id="dc-${i}" placeholder="اذكر البند الإجرائيّ الذي بُنِي عليه القرار."></textarea></div>
          <div class="row" style="justify-content:flex-end">
            ${btn('قبولُ التظلّم', `data-apdec="${i}|مقبول"`, 'p')}
            ${btn('رفضُ التظلّم', `data-apdec="${i}|مرفوض"`, 'red')}</div>` : ''}
      </div>`).join('') : empty('لا تظلّماتٍ مُقدَّمة في هذه الجلسة.')))}
  `;
}

/* ============ السجلّ ============ */
function viewLog() {
  return `
  ${pageHead('السجلّ', 'كلُّ تغييرٍ في حالةِ ملفٍّ يحمل: مَن، ومتى، وبأيّ صلاحية، وعلى أيّ مستند. السجلُّ لا يُمحى، وهو أوّلُ ما تطلبه لجنةُ التظلّم.')}
  ${card(head(`${num(DB.log.length, 'حركةٌ واحدة', 'حركتان', 'حركاتٍ', 'حركةً')} في هذه الجلسة`,
      'النموذجُ يبدأ بسجلٍّ فارغ: كلُّ ما تراه هنا فعلتَه أنت الآن — وهذا مقصود.')
    + logHtml(null, 100))}
  `;
}

</script>
<script>
/* ============================================================
   نتائج الدورة الثامنة — بياناتٌ حقيقية
   ------------------------------------------------------------
   مصدرُها الإعلانُ الرسميّ لوزارة الصحة في حفل الجائزة.
   تُعرَض بوصفها كذلك، ولا تُخلَط بأرقام المحاكاة: لا درجةَ منشورة
   لأيّ فائز — لأن الدرجات لم تُعلَن، وعرضُ درجةٍ مُخترَعة بجانب اسمٍ
   حقيقيّ أسوأُ من ألّا يُعرَض شيء.
   ============================================================ */

/** كلُّ التتويجات مسطّحةً: {name, eid, track, cat, rank} */
function flatWins() {
  const out = [];
  RESULTS.tracks.forEach(t => t.cats.forEach(c =>
    c.winners.forEach(([name, eid], i) => out.push({ name, eid, track: t.track, cat: c.cat, rank: i + 1 }))));
  return out;
}

function viewResults() {
  const wins = flatWins();

  /* التوزيع القطاعيّ — يُحسَب من الأسماء لا يُكتَب */
  const bySector = {};
  wins.forEach(w => { const e = E(w.eid); if (e) bySector[e.sector] = (bySector[e.sector] || 0) + 1; });
  const sectorRows = Object.entries(bySector).sort((a, b) => b[1] - a[1]);

  /* المتوَّجون أكثرَ من مرّة */
  const tally = {};
  wins.forEach(w => { (tally[w.eid] = tally[w.eid] || []).push(w); });
  const repeat = Object.entries(tally).filter(([, v]) => v.length > 1)
    .sort((a, b) => b[1].length - a[1].length);

  /* حجمُ كلّ مسار في التتويج */
  const perTrack = RESULTS.tracks.map(t => ({
    t: T(t.track),
    cats: t.cats.length,
    n: t.cats.reduce((a, c) => a + c.winners.length, 0)
  }));

  return `
  ${pageHead('نتائج الدورة الثامنة', RESULTS.headline + ' — أُعلِنت في ' + dt(RESULTS.day) + '.',
    pill('بياناتٌ حقيقية', 'g') + link('لوحة المنصّة', '#/board'))}

  ${note(`<b>هذه الصفحةُ وحدها ليست محاكاة.</b> أسماءُ الفائزين والمسارات والفئات والأوسمة مأخوذةٌ من ${esc(RESULTS.source)}.
    وما تراه في بقيّة المنصّة من درجاتٍ وترتيبٍ ومؤشّراتٍ محاكاةٌ للتشغيل. لذلك <b>لا تجد هنا درجةً لأيّ فائز</b>:
    الدرجاتُ لم تُعلَن، ووضعُ رقمٍ مُخترَعٍ بجانب اسمٍ حقيقيّ أسوأُ من ألّا يُعرَض شيء.`, 'g', 'shield')}

  <div class="grid g-4">
    ${stat(ar(RESULT_COUNT), 'جهةً تُوِّجت', 'في ' + ar(CATS.length) + ' فئات', 'gold')}
    ${stat(ar(TRACKS.length), 'مسارات للتميّز', ar(CATS.length) + ' فئةً داخلها')}
    ${stat(ar(RESULTS.medals.length), 'أوسمةٌ مسمّاة', 'عبر المسارات', 'gold')}
    ${stat(ar(new Set(wins.map(w => w.eid)).size), 'جهةً مختلفة', ar(repeat.length) + ' منها تكرّرت', 'ink')}
  </div>

  ${card(head('الأوسمة الثلاثة', 'تُمنَح على أبعادٍ منظوميّة تعبر المسارات كلَّها — لا داخل مسار. وذهبت ثلاثتُها إلى جهاتٍ أمّ لا إلى منشأةٍ متنافسة.')
    + `<div class="honor">${RESULTS.medals.map(m => {
        const md = MEDALS.find(x => x.id === m.medal);

  ${card(head('قراءةٌ في النتيجة', 'ثلاثةُ أشياء تقولها الأسماء ولا يقولها العدد.')

  `;
}

</script>
<script>

function viewVerdict() {
  const rows = [
    ['التسجيل ورفع المشاركة',

     'فصلَتِ المنصّةُ ثلاثةَ أشياء كانت واحداً: <b>التسجيل</b> (هويّةٌ وتفويض)، و<b>الأهليّة</b> (حكمٌ فوريّ من البيانات الرسمية)، و<b>الاستمارة</b> (تُفتَح للعشرة الأوائل وحدهم).'],
    ['عدد المراحل',
     'مرحلتان، ٥٠٪ لكلٍّ منهما.',
     'ثلاثُ مراحل: مؤشّرات → أنظمة → تحكيم، بتصفيةٍ ١٠ ← ٥ ← ٣.',
     'الثالثةُ <b>قرارٌ لا درجة</b> («مراجعةٌ نهائية لتأكيد الفائزين»). فبقي وزنُ الدرجة ٥٠+٥٠ كما في نصّك، وأُضيفت مرحلةُ قرارٍ فوقهما. النصّان يتّفقان بعد هذا التمييز.'],
    ['إطار التقييم',
     'غيرُ مذكور.',
     'إطارُ مالكولم بالدريج، ونموذجا ADLI للعمليات وLeTCI للنتائج.',
     'هذا أهمُّ ما في الدورة الثامنة، وكان غائباً عن ملخّصك. بُنِيَت عليه بطاقةُ التسجيل كاملةً بأبعادها الثمانية ومراسيها الوصفية.'],
    ['مسمّيات المسارات',
     '«كفاءة الخدمات الصحية» · «تعزيز الصحة العامة والوقاية من الأمراض».',
     '«كفاءة الخدمات الصحية <b>والاستدامة</b>» · «تعزيز الصحة العامة والوقاية».',
     'اعتُمِد نصُّ الدليل، وأُبقيَ الاسمُ الآخر ظاهراً في صفحة المسار. ونشرةُ الحفل زادت الأمرَ التباساً: سمَّته «التميّز في كفاءة الخدمات» بلا «استدامة». ثلاثةُ مصادرَ وثلاثةُ مسمّيات — وفي الجوائز المسمّى عقدٌ لا عنوان.'],
    ['أسماء لجنة التحكيم',
     'أحدَ عشرَ اسماً بأدوارهم.',
     'لا يذكر أسماءً.',
     'لم تُنشَر الأسماء في المنصّة. لسببين: أنها لم تُعتمَد في دليل الدورة الثامنة، ولأن قرن اسمِ المحكّم بملفٍّ بعينه يفتح باب الضغط. المنصّة تعرض الأسماءَ في صفحة الحوكمة إن اعتُمِدت، وتُخفي هويّةَ المُقيِّم عن لجنة التحكيم دائماً.']
  ];

  const gaps = [
    ['«تُوحَّد النتائج بالتوافق» — والتوافقُ بلا آلية اسمٌ للمشكلة لا حلٌّ لها.',
     'ما الذي يحدث حين لا يتوافق المقيّمان؟ الدليل صامت. وهذا أخطرُ صمتٍ فيه، لأنه يقع في القلب: نقطةِ تحويلِ حكمين بشريَّين إلى رقمٍ واحد.',
     'عتبةٌ رقميّة معلَنة (' + ar(CFG.divergence) + ' نقطة) تُوقِف الاعتماد آلياً، وحوارُ توحيدٍ بحضور خبير اللجنة العلمية، ومبرَّرٌ مكتوبٌ إلزاميّ يُقرأ في التظلّم.'],

    ['لا ذكرَ لحال المسار الذي لا يبلغ عشرةَ مؤهّلين.',
     'الإغراءُ الإداريّ أن يُكمَل العددُ بجهاتٍ لم تستوفِ الشروط، فتفقد العتبةُ معناها من أوّل دورة.',

    ['التظلّم عبر بريدٍ إلكترونيّ.',
     'قناةٌ بلا رقمٍ مرجعيّ، ولا حالةٍ يتابعها المتظلِّم، ولا مدّةِ بتٍّ معلنة. والجائزةُ التي لا يُقاس فيها زمنُ البتّ تُقاس بالشائعة.',

  return `
  ${pageHead('الحكم', 'قبل أيّ شاشة: ما الذي لا يصمد في التصوُّر الأوّليّ للمنصّة، وما الذي لا يحسمه الدليل نفسه، وما الذي نقضته النتيجةُ المعلنة من حكمي أنا. المنصّةُ بُنِيَت على ما بعد هذه الصفحة، لا على ما قبلها.',
    link('نتائج الدورة الثامنة', '#/results', 'gold'))}

  ${note(`<b>هذه الصفحةُ رُوجِعت بعد الحفل.</b> أُعلِنت نتائجُ الدورة الثامنة في ${dt(RESULTS.day)}، فنقضت ثلاثةً من افتراضاتي البنيوية وواحداً من أحكامي. القسمُ السادس أدناه يعرضها، ولم أحذف ما كتبتُه قبلها — الحكمُ الذي يُمحى أثرُه لا يُقاس.`, 'au', 'medal')}

  ${card(head('١ · الفرقُ بين ما طُلِب وما يقوله الدليل', 'خمسةُ فروقٍ غيّرت المعمار — لا الألوان.')

      rows.map(([a, b, c, d]) => `<tr>
        <td><b>${esc(a)}</b></td>

      <div class="card card--flat" style="border-color:var(--r-200)">
        <b>لو رُفِعت المشاركةُ عند التسجيل</b>
        <ul class="sm mut" style="padding-inline-start:18px;line-height:1.9">

          <li>ولاحتاج التقييمُ البشريّ ${ar(CASES.length)} ملفّاً بدل ${ar(cycleStats().qualified)} — كلفةٌ بلا عائد.</li>
          <li>ولفقدَتِ المرحلةُ الأولى معناها: هي <b>غربالٌ موضوعيّ</b> يسبق الكلام.</li>

      <div class="card card--flat" style="border-color:var(--g-200)">

          <li><b>التسجيل</b> مفتوحٌ لكلّ القطاعات — إثباتُ هويّةٍ وتفويضُ ممثّل.</li>
          <li><b>بوّابةُ الأهليّة</b> تُصدِر حكمَها <b>لحظةَ التسجيل</b> من البيانات الرسمية، بشروطها الثلاثة ظاهرة.</li>
          <li><b>الاستمارةُ</b> تُفتَح للعشرة الأوائل في كلّ مسار — وهي ما يُقيَّم بـ ADLI في المرحلة الثانية.</li>

<script>
/* جائزة أداء الصحة — الموجِّه، وتبديل الدور، والربط */

let ME = 'U-CH1';
let BFILTER = '';
let _lastHash = null;

/* ============ الصلاحيات: مَن يفتح أيّ شاشة ============ */
const CAN = {
  desk:      ['eval', 'expert', 'chair', 'judge', 'appeals', 'sec', 'entity'],
  // اللجنةُ التنفيذية (الأمانة) تدير الجدول والتشغيل ولا ترى درجةً قبل الاعتماد —
  // نصُّ الدليل في وصفها، ومفروضٌ هنا لا موصوفٌ فقط.
  case:      ['eval', 'expert', 'chair', 'judge', 'appeals'],
  consensus: ['eval', 'expert', 'chair', 'appeals'],
  judging:   ['judge', 'chair', 'appeals', 'sec'],
  appeals:   ['appeals', 'sec', 'chair'],
  log:       ['chair', 'appeals', 'sec'],
  // المُقيِّم والخبير وممثّلُ الجهة لا يرون لوحة الترتيب: المصفوفةُ في «الحوكمة»
  // ليست ديباجة — تُفرَض هنا. والجهةُ ترى مرتبتَها هي في ملفّها لا ترتيب غيرها.
  board:     ['chair', 'judge', 'appeals', 'sec']
};

const ROUTES = [
  { re: /^#?\/?$/,                    v: () => viewHome(),         nav: 'home' },
  { re: /^#\/board$/,                 v: () => viewBoard(),        nav: 'board', k: 'board' },
  { re: /^#\/track\/([A-Z]+)$/,       v: m => viewTrack(m[1]),     nav: 'board' },
  { re: /^#\/cat\/([A-Z]+:[A-Z]+)$/,  v: m => viewCat(m[1]),       nav: 'board' },
  { re: /^#\/results$/,               v: () => viewResults(),      nav: 'results' },
  { re: /^#\/register$/,              v: () => viewRegister(),     nav: 'reg' },
  { re: /^#\/entity\/([\w-]+)$/,      v: m => viewEntity(m[1]),    nav: 'reg' },
  { re: /^#\/desk$/,                  v: () => viewDesk(),         nav: 'desk',    k: 'desk' },
  { re: /^#\/case\/([\w-]+)$/,        v: m => viewCase(m[1]),      nav: 'desk',    k: 'case' },
  { re: /^#\/consensus\/([\w-]+)$/,   v: m => viewConsensus(m[1]), nav: 'desk',    k: 'consensus' },
  { re: /^#\/judging$/,               v: () => viewJudging(),      nav: 'judging', k: 'judging' },
  { re: /^#\/appeals$/,               v: () => viewAppeals(),      nav: 'appeals', k: 'appeals' },
  { re: /^#\/method$/,                v: () => viewMethod(),       nav: 'method' },
  { re: /^#\/gov$/,                   v: () => viewGov(),          nav: 'gov' },
  { re: /^#\/verdict$/,               v: () => viewVerdict(),      nav: 'verdict' },
  { re: /^#\/log$/,                   v: () => viewLog(),          nav: 'log',     k: 'log' }
];

/* ============ الشريط الجانبيّ ============ */
function buildRail() {
  const role = myRole();
  const b = boards();
  const openDiv = CATS.reduce((a, c) => a + b[c.key].counts.diverging, 0);
  const mine = ['eval', 'expert'].includes(role) ? myCases().filter(x => !(DB.reviews[x.r.c.id] || {})[ME]).length : 0;

  const items = [
    ['الجائزة', [
      ['home',    'الرئيسة',        '#/',         'home',   null],
      ['board',   'لوحة الجائزة',   '#/board',    'board',  null],
      ['method',  'المنهجية',       '#/method',   'method', null],
      ['gov',     'الحوكمة واللجان','#/gov',      'gov',    null]
    ]],
    ['النتائج', [
      ['results', 'نتائج الدورة الثامنة', '#/results', 'medal', null]
    ]],
    ['المشاركة', [
      ['reg',     'تسجيل جهة',      '#/register', 'reg',    null]
    ]],
    ['العمل', [
      ['desk',    'مكتبي',          '#/desk',     'desk',   mine || null],
      ['judging', 'قاعة التحكيم',   '#/judging',  'judge',  null],
      ['appeals', 'الحجب والتظلّم', '#/appeals',  'shield', null],
      ['log',     'السجلّ',          '#/log',      'log',    null]
    ]],
    ['', [
      ['verdict', 'الحكم',          '#/verdict',  'verdict', null]
    ]]
  ];

  const html = items.map(([g, list]) => {
    const vis = list.filter(([id]) => !CAN[id] || CAN[id].includes(role));
    if (!vis.length) return '';
    return `${g ? `<div class="nav__g">${esc(g)}</div>` : '<div style="block-size:8px"></div>'}
      ${vis.map(([id, t, h, i, n]) => `<a href="${h}" data-nav="${id}">${ic(i)}<span>${esc(t)}</span>
        ${id === 'desk' && n ? `<span class="nav__n nav__n--red">${ar(n)}</span>`
          : id === 'appeals' && openDiv ? `<span class="nav__n">${ar(openDiv)}</span>` : ''}</a>`).join('')}`;
  }).join('');

  document.getElementById('rail').innerHTML = `
    <a class="brand" href="#/">
      <span class="brand__mk">أداء</span>
      <span><span class="brand__t">جائزة أداء الصحة</span><span class="brand__s">${esc(CYCLE.name)} · ${ar(CYCLE.year)}</span></span>
    </a>
    <nav class="nav">${html}</nav>
    <div class="rail__foot">
      <b>جائزة أداء الصحة</b> — وزارة الصحة، المملكة العربية السعودية<br>
      <a href="mailto:${CYCLE.email}" dir="ltr">${CYCLE.email}</a>
      <div class="rail__ind">
        هذه المنصّةُ <b>نموذجٌ مستقلّ</b> لا تُمثّل الوزارة ولا تصدر عنها.<br>
        فكرةٌ وتنفيذ <span dir="ltr">MOAYAD ABOONQ</span>
      </div>
    </div>`;
}

/* ============ الرأس ============ */
function topbar() {
  const p = me(), R = ROLES[p.role];
  const comm = COMMITTEES.find(c => c.id === R.comm);
  return `<div class="top">
    <div class="top__who">${ic('user')} أنت الآن</div>
    <select class="top__sel" data-me>
      ${PEOPLE.map(x => `<option value="${x.id}" ${x.id === ME ? 'selected' : ''}>${esc(x.name)} — ${esc(ROLES[x.role].name)}</option>`).join('')}
    </select>
    <div class="top__ctx">${esc(R.desk)}${comm ? ' · ' + esc(comm.name) : ''}</div>
    <div class="top__sp">${pill(CYCLE.name + ' · ' + ar(CYCLE.year), 'g')}</div>
  </div>`;
}

/* ============ العرض ============ */
function render() {
  const h = location.hash || '#/';
  let out = null, nav = 'home', key = null;
  for (const r of ROUTES) {
    const m = h.match(r.re);
    if (m) { out = r.v(m); nav = r.nav; key = r.k; break; }
  }
  if (key && CAN[key] && !CAN[key].includes(myRole())) {
    out = `${pageHead('خارج صلاحيّتك', 'هذه الشاشة ليست ضمن ما يفتحه دورُك الحاليّ — وهذا سلوكٌ مقصود: الفصلُ بين اللجان يُفرَض تقنياً لا تنظيمياً فقط.')}
      ${card(note('دورُك الحاليّ: <b>' + esc(ROLES[myRole()].name) + '</b>. بدِّل الدور من أعلى الصفحة لترى المنصّة بعينٍ أخرى — كلُّ دورٍ يرى ما يخصّه وحده.', 'i', 'lock')
        + `<div class="hr"></div>${link('مصفوفة الصلاحيات', '#/gov')} ${link('الرئيسة', '#/')}`)}`;
  }
  if (out === null) { out = viewHome(); nav = 'home'; }

  document.getElementById('envbar').innerHTML =
    `<b>نموذجٌ مستقلّ غير تابعٍ لوزارة الصحة</b> · نسخةُ عرض — البنيةُ والمنهجيةُ من دليل ${esc(CYCLE.name)}، و<b>قيمُ المؤشّرات والدرجات محاكاة</b>. لا يُبنى قرارٌ على أرقام هذه النسخة.`;
  document.getElementById('top').innerHTML = topbar();

  const page = document.getElementById('page');
  page.innerHTML = out;
  if (h !== _lastHash) { window.scrollTo({ top: 0 }); _lastHash = h; }
  page.animate([{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }],
    { duration: 200, easing: 'cubic-bezier(.2,.8,.3,1)' });

  buildRail();
  document.querySelectorAll('.nav a').forEach(a => {
    if (a.dataset.nav === nav) a.setAttribute('aria-current', 'page');
    else a.removeAttribute('aria-current');
  });

  bind();
  const h1 = (page.querySelector('h1')?.textContent || '').trim();
  document.title = !h1 ? 'جائزة أداء الصحة · ' + CYCLE.name
    : h1.startsWith('جائزة أداء الصحة') ? h1 : 'جائزة أداء الصحة · ' + h1;
}

/* ============ إنشاء ملفٍّ جديد عند التسجيل ============ */
function createCase(entId, catKey) {
  const exist = CASES.find(c => c.entity === entId && c.key === catKey);
  if (exist) return exist.id;
  const ent = E(entId), cat = C(catKey), ks = kpisOf(catKey);
  const vals = {}; ks.forEach(k => { vals[k.id] = series(entId, catKey, k); });
  const r2 = mulberry32(seedOf(entId + catKey + 'feed'));
  const missing = [];
  if (ent.feed === 'partial') {
    cat.kpis.forEach(k => { if (r2() < 0.28) missing.push(k.id); });
    if (r2() < 0.45) missing.push('ESAT');
  }
  const id = `${entId}-${catKey.replace(':', '-')}`;
  CASES.push({ id, entity: entId, track: cat.track, cat: cat.id, key: catKey, vals, missing, registeredAt: '2026-02-24' });
  refresh();
  return id;
}

/* ============ الربط ============ */
function on(sel, ev, fn) { document.querySelectorAll(sel).forEach(el => el.addEventListener(ev, fn)); }

function bind() {
  /* تبديل الدور */
  on('[data-me]', 'change', e => {
    ME = e.target.value;
    const role = myRole();
    logIt(me().name, 'تبديلُ الدور', null, ROLES[role].name);
    if (role === 'entity') location.hash = '#/desk';
    render();
  });

  /* ---- نموذج التسجيل ---- */
  on('[data-reg]', 'change', e => {
    const k = e.target.dataset.reg;
    REG[k] = e.target.value;
    if (k === 'sector') { REG.entity = ''; REG.cat = ''; }
    if (k === 'entity') { REG.cat = ''; }
    REG.err = {};
    render();
  });
  on('[data-rep]', 'input', e => { REG.rep[e.target.dataset.rep] = e.target.value; });
  on('[data-ack]', 'change', e => { REG.ack[e.target.dataset.ack] = e.target.checked; });
  on('[data-reg-back]', 'click', e => { REG.step = +e.target.dataset.regBack; REG.err = {}; render(); });
  on('[data-reg-reset]', 'click', () => {
    Object.assign(REG, { step: 1, sector: '', entity: '', cat: '', rep: {}, ack: {}, done: null, err: {} });
    render();
  });
  on('[data-reg-next]', 'click', e => {
    const s = +e.target.dataset.regNext;
    REG.err = {};
    if (s === 1) {
      if (!REG.sector) REG.err.sector = 'اختر القطاع.';
      else if (!REG.entity) REG.err.entity = 'اختر الجهة كما هي في السجلّ الرسميّ.';
    }
    if (s === 2) {
      ['name', 'title', 'email', 'phone'].forEach(k => { if (!(REG.rep[k] || '').trim()) REG.err[k] = 'حقلٌ مطلوب.'; });
      if (REG.rep.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(REG.rep.email)) REG.err.email = 'بريدٌ غيرُ صالح.';
    }
    if (s === 3 && !REG.cat) REG.err.cat = 'اختر فئةً واحدة.';
    if (!Object.keys(REG.err).length) REG.step = s + 1;
    render();
  });
  on('[data-reg-submit]', 'click', () => {
    REG.err = {};
    if (!['data', 'evid', 'visit', 'rules'].every(k => REG.ack[k])) {
      REG.err.ack = 'الإقرارُ بالبنود الأربعة شرطُ تسجيل.';
      return render();
    }
    const cid = createCase(REG.entity, REG.cat);
    REG.done = cid;
    logIt(REG.rep.name || 'ممثّل الجهة', 'تسجيلُ مشاركة', cid, `${E(REG.entity).name} — ${catLabel(REG.cat)}`);
    render();
    window.scrollTo({ top: 0 });
  });

  /* ---- بطاقة التسجيل ---- */
  on('[data-sc]', 'click', e => {
    const [cid, key, k, v] = e.currentTarget.dataset.sc.split('|');
    DB.reviews[cid] = DB.reviews[cid] || {};
    const rv = DB.reviews[cid][ME] || { by: ME, adli: {}, letci: {}, visit: {}, note: '' };
    rv[key][k] = +v;
    DB.reviews[cid][ME] = rv;
    refresh(); render();
  });
  on('[data-note]', 'input', e => {
    const cid = e.target.dataset.note;
    DB.reviews[cid] = DB.reviews[cid] || {};
    DB.reviews[cid][ME] = DB.reviews[cid][ME] || { by: ME, adli: {}, letci: {}, visit: {}, note: '' };
    DB.reviews[cid][ME].note = e.target.value;
  });
  on('[data-sc-send]', 'click', e => {
    const cid = e.target.dataset.scSend;
    const rv = (DB.reviews[cid] || {})[ME];
    if (!rv) return;
    rv.at = new Date().toISOString().slice(0, 10);
    logIt(me().name, 'إرسالُ درجة', cid, `المُحصّلة ${fmt(reviewScore(rv), 1)} — ${ROLES[myRole()].name}`);
    refresh(); render();
  });

  /* ---- استمارة المشاركة ---- */
  on('[data-sec]', 'input', e => {
    const cid = e.target.dataset.case, s = e.target.dataset.sec;
    DB.submissions[cid] = DB.submissions[cid] || { sec: {}, files: [], at: null };
    DB.submissions[cid].sec[s] = e.target.value;
  });
  on('[data-up]', 'click', e => {
    const cid = e.target.dataset.up;
    DB.submissions[cid] = DB.submissions[cid] || { sec: {}, files: [], at: null };
    const n = DB.submissions[cid].files.length + 1;
    const kinds = ['محضر اجتماع', 'لقطة نظام', 'تقرير مُعتمَد', 'سجلّ أصليّ', 'شهادة تحقّق'];
    DB.submissions[cid].files.push({ n: `دليل-${n}.pdf`, t: kinds[(n - 1) % kinds.length] });
    logIt(me().name, 'رفعُ دليل', cid, `دليل-${n}.pdf`);
    render();
  });
  on('[data-unfile]', 'click', e => {
    const [cid, i] = e.target.dataset.unfile.split(':');
    DB.submissions[cid].files.splice(+i, 1);
    render();
  });
  on('[data-sub-send]', 'click', e => {
    const cid = e.target.dataset.subSend;
    const d = DB.submissions[cid] || { sec: {}, files: [], at: null };
    const filled = FORM.filter(f => (d.sec[f.id] || '').trim().length > 40).length;
    if (filled < FORM.length || !d.files.length) {
      alert(`لا تُرسَل الاستمارةُ قبل اكتمالها:\n• الأقسام المكتملة ${filled} من ${FORM.length} (٤٠ حرفاً فأكثر لكلّ قسم)\n• الأدلّة المرفوعة ${d.files.length} — ودليلٌ واحدٌ على الأقلّ شرط.\n\nنصُّ الدليل: «أدلّةٌ داعمة لكلّ نتيجةٍ مُبلَّغٍ عنها».`);
      return;
    }
    d.at = new Date().toISOString().slice(0, 10);
    DB.submissions[cid] = d;
    logIt(me().name, 'إرسالُ استمارة المشاركة', cid, `${d.files.length} دليلاً مرفوعاً`);
    render();
  });

  /* ---- التوحيد ---- */
  on('[data-cons]', 'click', e => {
    const cid = e.target.dataset.cons;
    const r = document.getElementById('cs-r');
    if (!r || r.value.trim().length < 25) {
      alert('المبرَّرُ شرطُ اعتماد. اكتب ما حسم الخلاف — لا صيغةً عامّة.\n(خمسةٌ وعشرون حرفاً فأكثر)');
      return;
    }
    const a = assignedTo(cid), rv = DB.reviews[cid];
    const evs = a.evals.map(u => rv[u]).filter(Boolean);
    const mid = (o1, o2) => { const o = {}; Object.keys(o1).forEach(k => o[k] = Math.round((o1[k] + o2[k]) / 2)); return o; };
    DB.consensus[cid] = {
      by: ME, at: new Date().toISOString().slice(0, 10), rationale: r.value.trim(),
      adli: mid(evs[0].adli, evs[1].adli), letci: mid(evs[0].letci, evs[1].letci), visit: mid(evs[0].visit, evs[1].visit)
    };
    logIt(me().name, 'اعتمادُ درجةٍ موحَّدة', cid, `المُحصّلة ${fmt(reviewScore(DB.consensus[cid]), 1)}`);
    refresh(); render();
  });

  /* ---- بطاقات التحكيم ---- */
  on('[data-bal]', 'click', e => {
    const [key, i, d] = e.currentTarget.dataset.bal.split('|');
    const b = boards()[key];
    DB.ballots[key] = DB.ballots[key] || {};
    const cur = DB.ballots[key][ME] || b.finalists.map(r => r.c.id);
    const a = +i, t = a + +d;
    if (t < 0 || t >= cur.length) return;
    [cur[a], cur[t]] = [cur[t], cur[a]];
    DB.ballots[key][ME] = cur;
    render();
  });
  on('[data-bal-send]', 'click', e => {
    const key = e.target.dataset.balSend;
    const b = boards()[key];
    DB.ballots[key] = DB.ballots[key] || {};
    DB.ballots[key][ME] = DB.ballots[key][ME] || b.finalists.map(r => r.c.id);
    logIt(me().name, 'إيداعُ بطاقة تحكيم', null, catLabel(key) + ' — الأول: ' + E(CASE(DB.ballots[key][ME][0]).entity).name);
    refresh(); render();
  });
  on('[data-confirm]', 'click', e => {
    const key = e.target.dataset.confirm;
    const b0 = boards()[key];
    // شرطُ الرفع المُعلَن في لوحة رئيس اللجنة العلمية — مفروضٌ هنا لا موصوفٌ فقط
    if (b0.counts.diverging) {
      alert(`لا تُعتمَد هذه الفئة: فيها ${b0.counts.diverging} ملفّاً بتباعُدٍ مفتوحٍ بين المقيّمَيْن.\n\n`
        + 'لجنةُ التحكيم تعتمد ترتيباً، وترتيبٌ مبنيٌّ على درجةٍ لم تُوحَّد هو ترتيبٌ بلا سند.\n'
        + 'أغلِق حوارات التوحيد أوّلاً — من مكتب اللجنة العلمية.');
      return;
    }
    const t = document.getElementById('cf-' + key);
    if (!t || t.value.trim().length < 20) { alert('مبرَّرُ الاعتماد شرطٌ — عشرون حرفاً فأكثر.'); return; }
    const b = boards()[key], bal = DB.ballots[key] || {};
    const ids = b.finalists.map(r => r.c.id);
    const pts = {}; ids.forEach(i => pts[i] = 0);
    Object.values(bal).forEach(l => l.forEach((id, i) => { if (pts[id] !== undefined) pts[id] += ids.length - i; }));
    DB.confirmed[key] = {
      order: ids.slice().sort((a, c) => pts[c] - pts[a]),
      by: ME, at: new Date().toISOString().slice(0, 10), rationale: t.value.trim()
    };
    logIt(me().name, 'اعتمادُ فائزي فئة', null, `${catLabel(key)} — ${E(CASE(DB.confirmed[key].order[0]).entity).name}`);
    refresh(); render();
  });

  /* ---- التظلّم ---- */
  on('[data-appeal]', 'click', e => {
    const cid = e.target.dataset.appeal;
    const t = document.getElementById('ap-' + cid);
    if (!t || t.value.trim().length < 25) { alert('نصُّ التظلّم شرطٌ — حدِّد الإجراء المُعترَض عليه في خمسةٍ وعشرين حرفاً فأكثر.'); return; }
    DB.appeals.unshift({
      case: cid, text: t.value.trim(), by: me().name,
      at: new Date().toISOString().slice(0, 10), status: 'قيد النظر', decision: null
    });
    logIt(me().name, 'تقديمُ تظلّم', cid, '');
    render();
  });
  on('[data-apdec]', 'click', e => {
    const [i, st] = e.target.dataset.apdec.split('|');
    const d = document.getElementById('dc-' + i);
    if (!d || d.value.trim().length < 20) { alert('القرارُ يحتاج تسبيباً — عشرون حرفاً فأكثر.'); return; }
    DB.appeals[+i].status = st;
    DB.appeals[+i].decision = d.value.trim();
    logIt(me().name, 'البتُّ في تظلّم', DB.appeals[+i].case, st);
    render();
  });

  /* ---- مرشِّح اللوحة ---- */
  on('[data-bfilter]', 'change', e => { BFILTER = e.target.value; render(); });
}

/* ============ الإقلاع ============ */
/* اتّجاهُ الوثيقة يُفرَض من هنا لا من وسم html وحده: النسخةُ المنشورة تُغلَّف
   بهيكلٍ لا يحمل dir="rtl"، وكلُّ الخصائص المنطقية (inline-start…) تتبعه. */
document.documentElement.setAttribute('dir', 'rtl');
document.documentElement.setAttribute('lang', 'ar');
window.addEventListener('hashchange', render);
render();

</script>
</body>
</html>
